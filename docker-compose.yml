version: '3.8'

services:
  rtms-mock:
    build: .
    ports:
      - "9092:9092"  # Handshake server
      - "8081:8081"  # Media server
    volumes:
      - ./data:/usr/src/app/data
    environment:
      - NODE_ENV=production
    restart: unless-stopped

  mock-data-ws:
    build: ./mock_data_ws
    ports:
      - "9095:9095"  # Mock data WebSocket + HTTP API
    environment:
      - PORT=9095
      - NODE_ENV=production
    restart: unless-stopped